[package]
rust-version.workspace = true
name = "seele-integrations"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Native Home Assistant and Taildrop services with bounded private IPC"

[dependencies]
seele-runtime = { workspace = true, features = ["reactor"] }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "fs", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
