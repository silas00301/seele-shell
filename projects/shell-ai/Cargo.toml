[package]
rust-version.workspace = true
name = "seele-shell-ai"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Bounded Fish command suggestions and private in-memory failure capture"

[dependencies]
seele-runtime = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
shlex = "1"
tempfile = { workspace = true }
signal-hook = { workspace = true }
unicode-general-category = { workspace = true }
