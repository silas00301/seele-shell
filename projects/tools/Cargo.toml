[package]
name = "seele-tools"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
ctrlc = "3.4"
dbus = "0.9"
dbus-crossroads = "0.5"
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
