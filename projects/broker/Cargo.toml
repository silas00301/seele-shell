[package]
rust-version.workspace = true
name = "seele-broker"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Bounded, memory-only inference broker and health publisher"

[dependencies]
seele-runtime = { workspace = true, features = ["reactor"] }
libc = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
jsonschema = { version = "0.56", default-features = false, features = ["arbitrary-precision"] }
tempfile = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
